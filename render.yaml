services:
  - type: web
    name: website-tronde-kiemtra
    runtime: python
    plan: free
    region: singapore # hoặc oregon / frankfurt
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        value: Longcang2026@
      - key: DEFAULT_EXAM_DURATION
        value: 50
      - key: SECRET_KEY
        generateValue: true
      - key: GEMINI_API_KEYS
        sync: false # Người dùng điền API key sau trên Render Dashboard nếu muốn dùng AI chấm tự luận
